name: Native UI provider evidence
on:
  pull_request:
    paths:
      - ".github/workflows/native-ui-release-evidence.yml"
      - "scaffolds/**/UiSessionControls.tsx"
      - "scaffolds/**/httpsAdapter.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "architecture/capabilities/registry.json"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Verify published Provider exports
        run: |
          pnpm install --frozen-lockfile
          node --input-type=module <<'NODE'
          import { startFrnlUiSession } from '@ultrst-armada/frnlts/runtime';
          import { handleUiSessionRequest } from '@ultrst-armada/kloks/backend/ui-session';
          import { getFloksFrnlFrontendApi } from '@ultrst-armada/floks/ui';
          for (const value of [startFrnlUiSession, handleUiSessionRequest, getFloksFrnlFrontendApi]) {
            if (typeof value !== 'function') throw new TypeError('Native UI export is missing');
          }
          NODE
