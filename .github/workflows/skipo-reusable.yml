name: Skipo Framework

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
        default: check

permissions:
  contents: write
  pull-requests: write

jobs:
  skipo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
      - name: Checkout Skipo framework
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Skipo
          path: .skipo-framework
      - name: Run Skipo operation
        env:
          SKIPO_OPERATION: ${{ inputs.operation }}
        run: |
          python3 .skipo-framework/scripts/skipo_cli.py "$SKIPO_OPERATION" "$GITHUB_WORKSPACE"
      - name: Commit Skipo changes
        if: inputs.operation == 'fix' || inputs.operation == 'update'
        run: |
          git config user.name "skipo-framework[bot]"
          git config user.email "skipo-framework[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(skipo): apply framework ${SKIPO_OPERATION}"
          git push
