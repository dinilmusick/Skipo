name: Skipo CI

on:
  push:
    branches: [main, feat/canonical-luth-auth-consolidation, feat/canonical-environment-constraint]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python checklists/test_lockfile_contract.py
      - run: python -m pip install pytest
      - run: python -m pytest -q --import-mode=importlib tests/linked_dependencies.test.py
      - run: python -m pytest -q --import-mode=importlib tests/self_upgrade.test.py
      - run: bash tests/smoke_published_cli.sh
      - run: python -m compileall -q scripts/skipo_builder.py checklists/24_capability_architecture.py
      - name: Independently verify all reconciled architectural engines
        run: |
          python -m pytest -q --import-mode=importlib \
            tests/reconciliation_transaction.test.py \
            tests/dependency_migration_contract.test.py \
            tests/dependency_migration_rollback.test.py \
            tests/dependency_migration_safety.test.py \
            tests/test_skipo_policy_engine.py \
            tests/test_skipo_policy_validation.py \
            tests/test_environment_governance_v2.py \
            tests/functional_capability_generation.test.py \
            tests/conformance_test.py
          node --test tests/semantic_architecture_analyzer.test.cjs
      - name: Prove generated canonical capability contracts for both application frameworks
        run: |
          node --test scaffolds/vite/tests/canonical-capabilities.test.cjs
          node --test scaffolds/nextjs/tests/canonical-capabilities.test.cjs
      - run: pnpm test
      - run: pnpm run capability:architecture
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm validate
