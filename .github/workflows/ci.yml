name: Skipo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --no-frozen-lockfile
      - run: python -m pip install pytest
      - run: python -m pytest -q --import-mode=importlib tests/linked_dependencies.test.py
      - run: python -m compileall -q scripts/skipo_builder.py
