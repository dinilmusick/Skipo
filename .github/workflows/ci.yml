name: Skipo CI

on:
  push:
    branches: [main, feat/canonical-luth-auth-consolidation, feat/canonical-environment-constraint]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact Skipo checkout and locked dependency identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sha256sum package.json packages/skipo/package.json pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Guard explicit Skipo publishing authority and immutable version
        run: node scripts/verify-publish-workflow.mjs
      - run: python checklists/test_lockfile_contract.py
      - run: python -m pip install pytest
      - run: python -m pytest -q --import-mode=importlib tests/linked_dependencies.test.py
      - run: python -m pytest -q --import-mode=importlib tests/self_upgrade.test.py
      - run: python -m pytest -q --import-mode=importlib tests/test_skipo_identity_migration_preservation.py
      - run: bash tests/smoke_published_cli.sh
      - name: Verify idempotent page/tab CLI and atomic rollback
        run: python -m pytest -q --import-mode=importlib tests/test_page_command_reconciliation.py
      - run: python -m compileall -q scripts/skipo_builder.py checklists/24_capability_architecture.py
      - name: Independently verify all reconciled architectural engines
        run: |
          python -m pytest -q --import-mode=importlib \
            tests/test_reconciliation_transaction.py \
            tests/test_dependency_migration_contract.py \
            tests/test_dependency_migration_rollback.py \
            tests/test_dependency_migration_safety.py \
            tests/test_skipo_policy_engine.py \
            tests/test_skipo_policy_validation.py \
            tests/test_environment_governance_v2.py \
            tests/test_functional_capability_generation.py \
            tests/conformance_test.py \
            tests/test_skipo_required_test_gates.py
          node --test tests/semantic_architecture_analyzer.test.cjs
      - name: Prove generated Vite capability contracts
        run: |
          app="$(mktemp -d)"
          python3 scripts/skipo_cli.py create CanonicalFixture "$app"
          (cd "$app" && node --test tests/canonical-capabilities.test.cjs)
          rm -rf "$app"
      - run: pnpm test
      - run: pnpm run capability:architecture
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm validate

  generated-applications:
    name: Generated Vite install / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact Skipo checkout and locked dependency identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sha256sum package.json packages/skipo/package.json pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate a clean application from real Skipo CLI
        run: python3 scripts/skipo_cli.py create ReconciliationFixture "$RUNNER_TEMP/skipo-application"
      - name: Install exact published Kloks and Floks artifacts
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm install --frozen-lockfile
      - name: Add a named tab through the public command
        run: node bin/skipo.js add main tab Mixer "$RUNNER_TEMP/skipo-application"
      - name: Typecheck generated app
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm run typecheck
      - name: Lint generated app
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm run lint
      - name: Exercise functional provider and workspace contracts
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm run test
      - name: Produce real application build
        working-directory: ${{ runner.temp }}/skipo-application
        env:
          APP_URL: https://skipo-ci.example.test
        run: pnpm run build
      - name: Verify all four gates through the public Skipo test CLI
        run: python3 scripts/skipo_cli.py test "$RUNNER_TEMP/skipo-application"
      - name: Open the generated application and named tab in Chromium
        run: |
          python -m pip install selenium==4.29.0
          python tests/generated_main_browser.py "$RUNNER_TEMP/skipo-application"
