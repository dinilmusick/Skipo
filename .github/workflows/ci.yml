name: Skipo CI

on:
  push:
    branches: [main, feat/canonical-luth-auth-consolidation, feat/canonical-environment-constraint]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python checklists/test_lockfile_contract.py
      - run: python -m pip install pytest
      - run: python -m pytest -q --import-mode=importlib tests/linked_dependencies.test.py
      - run: python -m pytest -q --import-mode=importlib tests/self_upgrade.test.py
      - run: bash tests/smoke_published_cli.sh
      - run: python -m compileall -q scripts/skipo_builder.py checklists/24_capability_architecture.py
      - name: Independently verify all reconciled architectural engines
        run: |
          python -m pytest -q --import-mode=importlib \
            tests/test_reconciliation_transaction.py \
            tests/test_dependency_migration_contract.py \
            tests/test_dependency_migration_rollback.py \
            tests/test_dependency_migration_safety.py \
            tests/test_skipo_policy_engine.py \
            tests/test_skipo_policy_validation.py \
            tests/test_environment_governance_v2.py \
            tests/test_functional_capability_generation.py \
            tests/conformance_test.py
          node --test tests/semantic_architecture_analyzer.test.cjs
      - name: Prove generated canonical capability contracts for both application frameworks
        run: |
          for framework in vite nextjs; do
            app="$(mktemp -d)"
            python3 scripts/skipo_cli.py create CanonicalFixture "$app" --framework "$framework"
            (cd "$app" && node --test tests/canonical-capabilities.test.cjs)
            rm -rf "$app"
          done
      - run: pnpm test
      - run: pnpm run capability:architecture
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm validate

  generated-applications:
    name: Generated ${{ matrix.framework }} install / test / build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [nextjs, vite]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate a clean application from real Skipo CLI
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: python3 scripts/skipo_cli.py create ReconciliationFixture "$RUNNER_TEMP/skipo-application" --framework "$FRAMEWORK"
      - name: Install exact published Kloks and Floks artifacts
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck generated app
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm run typecheck
      - name: Lint generated app
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm run lint
      - name: Exercise functional provider and workspace contracts
        working-directory: ${{ runner.temp }}/skipo-application
        run: pnpm run test
      - name: Produce real application build
        working-directory: ${{ runner.temp }}/skipo-application
        env:
          APP_URL: https://skipo-ci.example.test
        run: pnpm run build
