name: Reconciliation lockfile regeneration (temporary)
on:
  push:
    branches: [reconcile/architecture-lifecycle-20261117]
    paths:
      - package.json
      - .github/workflows/reconciliation-lockfile-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'dinilmusick/Skipo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/architecture-lifecycle-20261117
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from exact provider baselines
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit only the lockfile, if changed
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(reconcile): refresh deterministic provider lockfile"
            git push origin HEAD:reconcile/architecture-lifecycle-20261117
          fi
