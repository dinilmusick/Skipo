name: Publish Skipo npm packages

on:
  push:
    tags:
      - "skipo-v*"
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Issue trigger is intentionally exact and owner-only; no arbitrary ref,
    # package name, command or version comes from an issue body.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == 'dinilmusick' &&
       github.event.issue.title == '[skipo-publish] 1.3.0')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact checked-out release commit and matching package versions
        id: release
        shell: bash
        env:
          ISSUE_COMMIT_SHA: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout does not match triggering commit"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            TAG_VERSION="1.3.0"
            [[ "$ISSUE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Issue body must contain only the main commit SHA"; exit 1; }
            test "$ISSUE_COMMIT_SHA" = "$(git rev-parse HEAD)"
          else
            TAG_VERSION="${GITHUB_REF_NAME#skipo-v}"
          fi
          SKIPO_VERSION="$(node -p "require('./packages/skipo/package.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$SKIPO_VERSION"
          test "$TAG_VERSION" = "$ROOT_VERSION"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack actual release candidate
        working-directory: packages/skipo
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Check npm version uniqueness (fail closed on registry errors)
        id: registry
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@ultrst-armada/skipo@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/npm-version.out" 2> "$RUNNER_TEMP/npm-version.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@ultrst-armada/skipo@${PACKAGE_VERSION} is immutable and already published; no publish will be attempted."
          elif grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/npm-version.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Registry lookup failed for a reason other than a missing version; aborting publication." >&2
            cat "$RUNNER_TEMP/npm-version.err" >&2
            exit 1
          fi

      - name: Publish unique version using npm Trusted Publishing
        if: steps.registry.outputs.exists == 'false'
        working-directory: packages/skipo
        run: npm publish --provenance --access public

      - name: Do not misrepresent an existing version as this commit's release
        if: steps.registry.outputs.exists == 'true'
        run: echo "::warning::Existing npm version is only being checked as a historical registry artifact; this source commit was not published."

      - name: Independently verify the actual public npm consumer artifact
        env:
          SKIPO_REGISTRY_VERSION: ${{ steps.release.outputs.version }}
        run: bash tests/smoke_published_cli.sh
