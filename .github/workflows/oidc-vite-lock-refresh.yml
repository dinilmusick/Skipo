name: Refresh generated Vite OAuth lockfile
on:
  push:
    branches: [fix/canonical-oauth-bff-scaffold-20261119]
    paths: ['.github/workflows/oidc-vite-lock-refresh.yml']
permissions:
  contents: write
jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Refresh only generated Vite scaffold's immutable lockfile
        working-directory: scaffolds/vite
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          node --input-type=module <<'NODE'
          const k=await import('@ultrst-armada/kloks/backend/auth');
          const f=await import('@ultrst-armada/floks/auth');
          if (typeof k.createCanonicalApplicationOAuthBff !== 'function') throw Error('Kloks auth BFF API missing');
          if (typeof f.LuthOidcGate !== 'function') throw Error('Floks LuthOidcGate API missing');
          console.log('Verified installed canonical auth exports from frozen generated Vite lock');
          NODE
      - name: Commit immutable generated Vite lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scaffolds/vite/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Vite lock matches verified published OAuth dependencies'
          else
            git commit -m 'build(auth): lock verified Kloks, Floks and GutTS in generated Vite app'
            git push origin HEAD:${{ github.ref_name }}
          fi
