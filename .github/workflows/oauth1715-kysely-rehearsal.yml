name: Better Auth 1.7.15 Kysely PostgreSQL issuer rehearsal
on:
  push:
    branches: [ci/oauth1715-schema-rehearsal-20261120]
    paths:
      - scripts/oauth1715-kysely.config.ts
      - .github/workflows/oauth1715-kysely-rehearsal.yml
permissions:
  contents: read
jobs:
  generate-apply-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate from official Better Auth and real PostgreSQL Kysely adapter
        shell: bash
        env:
          PGTEST_URL: postgresql://auth_test:auth_test@127.0.0.1:5432/auth_test
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/better-auth-kysely-1715"
          mkdir -p "$root" "$GITHUB_WORKSPACE/artifacts/official-oauth-kysely"
          cp scripts/oauth1715-kysely.config.ts "$root/auth.ts"
          cd "$root"
          printf '%s\n' '{"name":"better-auth-1715-kysely-rehearsal","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund --save-exact auth@1.7.15 better-auth@1.7.15 @better-auth/core@1.7.15 @better-auth/oauth-provider@1.7.15 better-call@1.4.4 pg@8.16.3 kysely@0.29.8
          ./node_modules/.bin/auth generate --config ./auth.ts --output ./schema-kysely.sql --yes
          test -s schema-kysely.sql
          cp schema-kysely.sql "$GITHUB_WORKSPACE/artifacts/official-oauth-kysely/schema-kysely.sql"
          echo '--- Official Kysely SQL generated for empty temporary PostgreSQL ---'
          cat schema-kysely.sql
          node --input-type=module <<'JS'
          import pg from 'pg';
          import { readFileSync } from 'node:fs';
          const pool = new pg.Pool({ connectionString: process.env.PGTEST_URL });
          const sql = readFileSync('schema-kysely.sql','utf8');
          await pool.query(sql);
          const result = await pool.query("SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name");
          const expected = ['oauthClient','oauthResource','oauthClientResource','oauthRefreshToken','oauthAccessToken','oauthConsent','oauthClientAssertion','jwks','user','account','session','verification'];
          for(const name of expected) if(!result.rows.some(r=>r.table_name===name)) throw Error('MISSING_OFFICIAL_KYSELY_TABLE: '+name);
          const fields = await pool.query("SELECT column_name,data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='oauthClient'");
          if(!fields.rows.some(r=>r.column_name==='clientId')) throw Error('MISSING_CANONICAL_CAMEL_CLIENT_ID');
          if(!fields.rows.some(r=>r.column_name==='redirectUris' && r.data_type==='jsonb')) throw Error('OAUTH_REDIRECT_URIS_MUST_BE_JSONB');
          console.log('Official Kysely PostgreSQL schema verified, tables='+expected.join(','));
          await pool.end();
          JS
          ./node_modules/.bin/auth generate --config ./auth.ts --output ./schema-after.sql --yes
          if test -s schema-after.sql; then
            echo 'ERROR: official schema is not idempotent on temporary Postgres'
            cat schema-after.sql
            exit 1
          fi
          npm ls better-auth @better-auth/oauth-provider @better-auth/core better-call --depth=0 > "$GITHUB_WORKSPACE/artifacts/official-oauth-kysely/versions.txt"
          sha256sum "$GITHUB_WORKSPACE"/artifacts/official-oauth-kysely/* > "$GITHUB_WORKSPACE/artifacts/official-oauth-kysely/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luth-better-auth-1715-kysely-schema-and-test
          path: artifacts/official-oauth-kysely/
          retention-days: 7
