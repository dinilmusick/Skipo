name: Owner-approved pinned Skipo npm release
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: >-
      github.event.issue.user.id == 155351357 &&
      github.event.issue.title == '[skipo-npm-release] publish'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable owner-approved main and published package identity
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Owner issue body must be the exact main SHA' >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$APPROVED_SHA" = "$GITHUB_SHA" || {
            echo 'Main changed since this release was approved' >&2
            exit 1
          }
          version="$(node -e 'const a=require("./package.json"),b=require("./packages/skipo/package.json"); if(a.version!==b.version || b.name!=="@ultrst-armada/skipo") process.exit(1); process.stdout.write(b.version)')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$version" != '1.3.0' ]] || {
            echo 'Legacy package version must not be published by this workflow' >&2
            exit 1
          }
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$APPROVED_SHA" || {
            echo 'Main advanced before dispatch; new approval required' >&2
            exit 1
          }
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-skipo-cli.yml/dispatches" \
            -f ref=main -F 'inputs[publish]=true' -f "inputs[version]=$version"
          echo "Dispatched trusted Skipo release for $version at $APPROVED_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'Only a successful downstream publish with npm provenance and independent packed-consumer verification establishes release.' >> "$GITHUB_STEP_SUMMARY"
