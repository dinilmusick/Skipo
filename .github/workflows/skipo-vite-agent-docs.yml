name: Skipo generated Vite agent documentation contract

on:
  pull_request:
    paths:
      - "scaffolds/vite/README.md"
      - "scaffolds/vite/SCAFFOLD_GUIDE.md"
      - "scaffolds/vite/SKILL.md"
      - "scaffolds/vite/architecture/**"
      - "tests/test_vite_generated_docs_contract.py"
      - ".github/workflows/skipo-vite-agent-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify actual generated app and referenced authority documentation
        run: python -m pytest -q tests/test_vite_generated_docs_contract.py
