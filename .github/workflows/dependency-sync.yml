name: Upstream Dependency Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-package-published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-dependency-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Sync published upstream dependencies
        id: updates
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const file = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            const name = '@dinilmusick/gutts';
            pkg.dependencies = pkg.dependencies || {};
            if (!pkg.dependencies[name] && !pkg.devDependencies?.[name] && !pkg.optionalDependencies?.[name]) {
              try {
                const ver = require('node:child_process').execSync('npm view @dinilmusick/gutts version').toString().trim();
                if (ver) {
                  pkg.dependencies[name] = '^' + ver;
                  fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\\n');
                }
              } catch (error) {
                console.error('Unable to resolve the published GutTS version:', error.message);
                process.exitCode = 1;
              }
            }
          "
          npx --yes npm-check-updates@latest --upgrade --filter '@dinilmusick/gutts,@ultrst-armada/krnl,@ultrst-armada/frnlts,@ultrst-armada/kloks,@ultrst-armada/floks'
          if git diff --quiet -- package.json ':(glob)**/package.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies and refresh lockfile
        if: steps.updates.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Build
        if: steps.updates.outputs.changed == 'true'
        run: pnpm run build
      - name: Typecheck
        if: steps.updates.outputs.changed == 'true'
        run: pnpm run typecheck
      - name: Test
        if: steps.updates.outputs.changed == 'true'
        run: pnpm run test
      - name: Open or update dependency PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.ECOSYSTEM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/upstream-dependency-sync
          delete-branch: true
          commit-message: "chore(deps): sync verified upstream package versions"
          title: "chore(deps): sync verified upstream package versions"
          body: |
            Automated update of published GutTS, KrnlTS, FrnlTS, Kloks, and Floks dependencies.

            Generated from the upstream dependency sync workflow. Package metadata, lockfile,
            build, typecheck, and tests are validated before this pull request is updated.
          labels: dependencies, automated
          signoff: false
