name: Skipo integrated architecture gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install exact framework dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all reconciliation and adversarial suites
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_skipo_policy_engine.py tests/test_skipo_policy_validation.py tests/test_environment_contract.py tests/test_environment_cli_lifecycle.py tests/test_environment_governance_v2.py tests/test_reconciliation_transaction.py tests/test_dependency_migration_contract.py tests/test_dependency_migration_rollback.py tests/test_dependency_migration_safety.py tests/conformance_test.py tests/test_functional_capability_generation.py
          node --test tests/semantic_architecture_analyzer.test.cjs
          pnpm exec vitest run tests/functional_capability_provider.test.ts tests/functional_capability_routes.test.ts tests/functional_capability_typecheck.test.ts
      - name: Framework full tests and package build
        run: |
          pnpm test
          pnpm run build --if-present
      - name: Clean-room packed CLI verification
        run: bash tests/smoke_published_cli.sh
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-gate-evidence
          path: |
            test-results/**
            reports/**
          if-no-files-found: ignore
