name: Skipo generated Vite theme and user-tab ownership

on:
  pull_request:
    paths:
      - "scaffolds/vite/src/index.css"
      - "scripts/skipo_canonical_shell.py"
      - "scaffolds/vite/src/frontend/pages/main/**"
      - "scaffolds/vite/src/frontend/pages/main/tabs/**"
      - "tests/test_vite_theme_tabs_contract.py"
      - ".github/workflows/skipo-vite-theme-tabs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-app:
    name: Floks tokens and canonical app tabs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Exercise real CLI create and inspect generated CSS and tabs
        run: python -m pytest -q tests/test_vite_theme_tabs_contract.py
