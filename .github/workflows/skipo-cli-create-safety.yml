name: Skipo atomic create CLI safety

on:
  pull_request:
    paths:
      - "scripts/skipo_cli.py"
      - "tests/test_cli_create_safety.py"
      - ".github/workflows/skipo-cli-create-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-safety:
    name: Atomic create and existing-code preservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: python -m pip install pytest
      - name: Prove traversal, symlink, force-safety and rollback
        run: python -m pytest -q tests/test_cli_create_safety.py
      - name: Prove actual nonproduction CLI can generate a fresh application
        shell: bash
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          python3 scripts/skipo_cli.py create SafeApp "$fixture/SafeApp"
          test -f "$fixture/SafeApp/.skipo/project.json"
          test -f "$fixture/SafeApp/src/libraries/skipo/auth.ts"
          before="$(sha256sum "$fixture/SafeApp/src/libraries/skipo/auth.ts" | cut -d ' ' -f1)"
          if python3 scripts/skipo_cli.py create SafeApp "$fixture/SafeApp" --force; then
            echo "Create --force overwrote an existing app" >&2
            exit 1
          fi
          after="$(sha256sum "$fixture/SafeApp/src/libraries/skipo/auth.ts" | cut -d ' ' -f1)"
          test "$before" = "$after"
