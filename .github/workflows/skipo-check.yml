name: Skipo Check

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Skipo operation"
        required: true
        default: verify
        type: choice
        options:
          - inspect
          - check
          - diagnose
          - plan
          - add
          - remove
          - sync
          - update
          - repair
          - verify
          - test
          - policy
          - semantic
          - certify
  pull_request:
    paths:
      - ".skipo/**"
      - "src/**"
      - "scripts/**"
      - "architecture/**"
      - "checklists/**"
      - "package.json"
      - "SKILL.md"
      - "IMPLEMENTATION-SPEC.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  skipo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install complete framework toolchain for mandatory semantic checks
        run: pnpm install --frozen-lockfile
      - name: Run Skipo operation
        env:
          SKIPO_OPERATION: ${{ github.event.inputs.operation || 'verify' }}
        run: |
          python3 scripts/skipo_cli.py "$SKIPO_OPERATION" "$GITHUB_WORKSPACE"
      - name: Commit Skipo changes
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.operation == 'repair' || github.event.inputs.operation == 'update' || github.event.inputs.operation == 'add' || github.event.inputs.operation == 'remove' || github.event.inputs.operation == 'sync')
        run: |
          git config user.name "skipo-framework[bot]"
          git config user.email "skipo-framework[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(skipo): apply framework ${SKIPO_OPERATION}"
          git push
