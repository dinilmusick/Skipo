name: Canonical OAuth dependency lock refresh
on:
  push:
    branches: [fix/canonical-oauth-bff-scaffold-20261119]
    paths: ['.github/workflows/oidc-dependency-lock-refresh.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-published-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Verify exact npm package availability and regenerate lockfile
        run: |
          set -euo pipefail
          npm view @dinilmusick/gutts@2.2.3 version
          missing=0
          for package in '@ultrst-armada/floks@2.0.9' '@ultrst-armada/kloks@2.2.5'; do
            if npm view "$package" version --fetch-retries=1; then
              echo "Verified registry metadata: $package"
            else
              echo "::error::Unpublished or inaccessible canonical npm package: $package"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 42; fi
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          node --input-type=module <<'NODE'
          const kloks = await import('@ultrst-armada/kloks/backend/auth');
          const floks = await import('@ultrst-armada/floks/auth');
          const client = await import('@ultrst-armada/kloks/auth');
          for (const [name, actual] of [
            ['Kloks createCanonicalApplicationOAuthBff', kloks.createCanonicalApplicationOAuthBff],
            ['Floks LuthOidcGate', floks.LuthOidcGate],
            ['Kloks createApplicationAuthClient', client.createApplicationAuthClient],
          ]) {
            if (typeof actual !== 'function') throw new Error('Missing published canonical OAuth API: ' + name);
            console.log('Verified ' + name);
          }
          NODE
      - name: Commit verified frozen lockfile to existing review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Frozen lockfile already matches verified published packages."
          else
            git commit -m "build(auth): lock and verify published Kloks, Floks and GutTS OAuth packages"
            git push origin HEAD:${{ github.ref_name }}
          fi
